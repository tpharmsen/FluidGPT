epochs: 120
batch_size: 192
init_lr: 4.0e-4
patience: 3
weight_decay: 1.0e-4
inj_noise: False
train_ratio: 0.8
normalize: True
pin_memory: True
num_workers: 16
forward_steps_loss: 3
persistent_workers: True
prefetch_factor: 4
strategy: "ddp"
lr_milestones: [60, 80, 100]
warmup_epochs: 3

from_frame: 5
int_steps: 20
noise_type: 'gaussiangaussian'  # options: 'puregaussian', 'checkerboard'
sigma_time: 1.0 # original 3.0
sigma_space: 4.0 # original 5.0

plottrain_out: "plot_train.png"
plotval_out: "plot_val.png"
plotvalf_out: "plotf_val.png"
anim_out: "anim_val.gif"
checkpoint: 'checkpoint.pth'
spectra_out: "energyenstrophyspectra.png"