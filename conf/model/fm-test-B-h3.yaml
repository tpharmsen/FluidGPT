model_name: "FluidGPT"
in_channels: 2
temporal_bundling: 16
emb_dim: 96
embedder_type: "linear"  # options: "linear", "conv_v1", "conv_v2"
patch_size: 8
hiddenout_dim: 512
flowmatching_emb_dim: 512
depth: 2
stage_depths: [6,6,8,6,6]
num_heads: [16,32,64,32,16]
window_size: 4
use_flex_attn: True
causal_attn: "custom"
act: "gelu"
skip_enable: True
skipblock: "convnext"
gradient_flowthrough: [True, True, True]
final_layer: False