model_name: "FluidGPT"
in_channels: 2
temporal_bundling: 16
emb_dim: 96
embedder_type: "conv_v2"  # options: "linear", "conv_v1", "conv_v2"
patch_size: 8
hiddenout_dim: 192
flowmatching_emb_dim: 512
depth: 2
stage_depths: [9,9,10,9,9]
num_heads: [32,32,64,32,32]
window_size: 4
use_flex_attn: True
causal_attn: "custom_v2"
act: "gelu"
skip_enable: True
skipblock: "convnext"
gradient_flowthrough: [True, True, True]