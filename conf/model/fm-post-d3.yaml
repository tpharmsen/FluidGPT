model_name: "FluidGPT"
in_channels: 2
temporal_bundling: 10
emb_dim: 48
embedder_type: "linear"  # options: "linear", "conv_v1", "conv_v2"
patch_size: 4
hiddenout_dim: 512
flowmatching_emb_dim: 512
depth: 3
stage_depths: [9,9,9,10,9,9,9]
num_heads: [8,8,8,16,8,8,8]
window_size: 4
use_flex_attn: True
causal_attn: "custom"
act: "gelu"
skip_enable: True
skipblock: "convnext"
gradient_flowthrough: [True, True, True]
final_layer: False

